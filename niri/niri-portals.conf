# niri's default portal list, except the file chooser: nautilus 51 (gnome portal's chooser) segfaults
# on niri, which lacks the xdg-foreign protocol it uses to parent the dialog to the app window.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
