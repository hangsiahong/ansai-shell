<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ansai-shell: Khmer text inside the UI fonts falls back to Kantumruy Pro (modern, round) before Noto Sans Khmer. -->
<fontconfig>
  <selectfont><rejectfont><glob>*/inter-latin.ttf</glob></rejectfont></selectfont>
  <alias binding="weak"><family>Inter</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <alias binding="weak"><family>Google Sans Flex</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <alias binding="weak"><family>Geist</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <alias binding="weak"><family>Figtree</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <alias binding="weak"><family>Nunito</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <alias binding="weak"><family>Roboto</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <alias binding="weak"><family>Noto Sans</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <alias binding="weak"><family>Cantarell</family><accept><family>Kantumruy Pro</family><family>Noto Sans Khmer</family></accept></alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>km</string></test>
    <edit name="family" mode="prepend"><string>Kantumruy Pro</string></edit>
  </match>
</fontconfig>
